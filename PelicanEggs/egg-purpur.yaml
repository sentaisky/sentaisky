scripts:
  installation:
    script: |-
      #!/bin/ash
      # Purpur Installation Script
      #
      # Server Files: /mnt/server
      PROJECT=purpur

      if [ -n "${DL_PATH}" ]; then
          echo -e "Using supplied download URL: ${DL_PATH}"
          DOWNLOAD_URL=`eval echo $(echo ${DL_PATH} | sed -e 's/{{/${/g' -e 's/}}/}/g')`
      else
          VER_EXISTS=`curl -s https://api.purpurmc.org/v2/${PROJECT} | jq -r --arg VERSION $MINECRAFT_VERSION '.versions[] | contains($VERSION)' | grep true`
          LATEST_VERSION=`curl -s https://api.purpurmc.org/v2/${PROJECT} | jq -r '.versions' | jq -r '.[-1]'`

          if [ "${VER_EXISTS}" == "true" ]; then
              echo -e "Version is valid. Using version ${MINECRAFT_VERSION}."
          else
              echo -e "No valid version provided. Using latest ${PROJECT} version."
              MINECRAFT_VERSION=${LATEST_VERSION}
          fi

          BUILD_EXISTS=`curl -s https://api.purpurmc.org/v2/${PROJECT}/${MINECRAFT_VERSION} | jq -r --arg BUILD ${BUILD_NUMBER} '.builds.all | tostring | contains($BUILD)' | grep true`
          LATEST_BUILD=`curl -s https://api.purpurmc.org/v2/${PROJECT}/${MINECRAFT_VERSION} | jq -r '.builds.latest'`

          if [ "${BUILD_EXISTS}" == "true" ]; then
              echo -e "Build is valid for version ${MINECRAFT_VERSION}. Using build ${BUILD_NUMBER}."
          else
              echo -e "No valid build provided. Using latest build for version ${MINECRAFT_VERSION}."
              BUILD_NUMBER=${LATEST_BUILD}
          fi

          JAR_NAME=${PROJECT}-${MINECRAFT_VERSION}-${BUILD_NUMBER}.jar

          echo "Resolved download target"
          echo -e "MC Version: ${MINECRAFT_VERSION}"
          echo -e "Build: ${BUILD_NUMBER}"
          echo -e "Artifact: ${JAR_NAME}"
          DOWNLOAD_URL=https://api.purpurmc.org/v2/${PROJECT}/${MINECRAFT_VERSION}/${BUILD_NUMBER}/download
      fi

      cd /mnt/server

      echo -e "Downloading: curl -o ${SERVER_JARFILE} ${DOWNLOAD_URL}"

      if [ -f ${SERVER_JARFILE} ]; then
          mv ${SERVER_JARFILE} ${SERVER_JARFILE}.old
      fi

      curl -o ${SERVER_JARFILE} ${DOWNLOAD_URL}

      if [ ! -f server.properties ]; then
          echo -e "Downloading default server.properties"
          curl -o server.properties https://raw.githubusercontent.com/parkervcp/eggs/master/minecraft/java/server.properties
      fi

      echo -e "Installation complete."
    container: 'ghcr.io/parkervcp/installers:alpine'
    entrypoint: ash
variables:
  -
    sort: 1
    name: 'Minecraft Version'
    description: |-
      Die Minecraft-Version, die heruntergeladen werden soll. Verwende „latest“, um immer die aktuelle
      stabile Version zu beziehen. Ungültige Angaben werden automatisch auf die neueste Version gesetzt.
    env_variable: MINECRAFT_VERSION
    default_value: latest
    user_viewable: true
    user_editable: true
    rules:
      - required
      - string
      - 'max:20'
  -
    sort: 2
    name: 'Server Jar File'
    description: |-
      Dateiname der Server-JAR. Standard ist „server.jar“. Ändere den Wert, wenn deine Datei anders
      heißt.
    env_variable: SERVER_JARFILE
    default_value: server.jar
    user_viewable: true
    user_editable: true
    rules:
      - required
      - 'regex:/^([\w\d._-]+)(\.jar)$/'
      - 'max:80'
  -
    sort: 3
    name: 'Build Nummer'
    description: |-
      Build-Nummer für die gewählte Purpur-Version. Belasse „latest“, um automatisch den neuesten
      Build zu verwenden. Ungültige Angaben werden auf den neuesten Build gesetzt.
    env_variable: BUILD_NUMMER
    default_value: latest
    user_viewable: true
    user_editable: true
    rules:
      - required
      - string
      - 'max:20'
  -
    sort: 4
    name: 'XMS RAM'
    description: 'Anfangszuweisung (Xms) in MB. Empfohlen sind 25–50 % des maximalen RAM.'
    env_variable: Sel_XMS
