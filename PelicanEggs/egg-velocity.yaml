    description: |-
      Build-Nummer für die angegebene Velocity-Version. Relasse „latest“, um automatisch den neuesten
      Build zu verwenden. Bei ungültigen Angaben wird der neueste Build gewählt.
    env_variable: BUILD_NUMBER
